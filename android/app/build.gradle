apply plugin: "com.android.application"
apply plugin: "org.jetbrains.kotlin.android"
apply plugin: "com.facebook.react"
apply plugin: "com.google.gms.google-services"  // TODO: re-enable after adding google-services.json

// react-native-config — reads your .env file
apply from: project(':react-native-config').projectDir.getPath() + "/dotenv.gradle"

// react-native-vector-icons — copies icon fonts into assets
apply from: "../../node_modules/react-native-vector-icons/fonts.gradle"

def enableProguardInReleaseBuilds =
        (project.findProperty("enableProguardInReleaseBuilds") ?: "false")
                .toString()
                .toBoolean()

react {
    /* Automatically determined by the build. */
    autolinkLibrariesWithApp()
}

android {
    ndkVersion rootProject.ext.ndkVersion
    buildToolsVersion rootProject.ext.buildToolsVersion
    compileSdk rootProject.ext.compileSdkVersion

    namespace "com.agentcontrol"

    defaultConfig {
        applicationId "com.agentcontrol"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode 1
        versionName "1.0"

        // react-native-config — expose .env vars to Android
        resValue "string", "build_config_package", "com.agentcontrol"
    }

    signingConfigs {
        debug {
            storeFile file('debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
        release {
            // Set these in .env (loaded by react-native-config's dotenv.gradle into
            // project.env) or as real OS/CI environment variables:
            // ANDROID_KEYSTORE_PATH, ANDROID_KEY_ALIAS,
            // ANDROID_STORE_PASSWORD, ANDROID_KEY_PASSWORD
            def keystorePath = project.env.ANDROID_KEYSTORE_PATH ?: System.getenv("ANDROID_KEYSTORE_PATH")
            if (keystorePath) {
                storeFile     file(keystorePath)
                keyAlias      project.env.ANDROID_KEY_ALIAS ?: System.getenv("ANDROID_KEY_ALIAS")
                storePassword project.env.ANDROID_STORE_PASSWORD ?: System.getenv("ANDROID_STORE_PASSWORD")
                keyPassword   project.env.ANDROID_KEY_PASSWORD ?: System.getenv("ANDROID_KEY_PASSWORD")
            } else {
                // Fallback to debug keystore during local dev
                storeFile file('debug.keystore')
                storePassword 'android'
                keyAlias 'androiddebugkey'
                keyPassword 'android'
            }
        }
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.debug
        }
        release {
            signingConfig signingConfigs.release
            minifyEnabled enableProguardInReleaseBuilds
            proguardFiles getDefaultProguardFile("proguard-android.txt"), "proguard-rules.pro"
        }
    }
}

dependencies {
    // The version of react-native is set by the React Native Gradle Plugin
    implementation("com.facebook.react:react-android")
    implementation("com.facebook.react:hermes-android")
     // Firebase BoM — pins all Firebase library versions
    implementation platform('com.google.firebase:firebase-bom:34.13.0')
    implementation 'com.google.firebase:firebase-analytics'
    implementation 'com.google.firebase:firebase-messaging'
}

